name: Java CI

on: [push]

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: 'nvd'
          server-password: NVD_API_KEY
          cache: 'maven'

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v1

      - name: Build with Maven
        run: mvn -B -q install

      - name: Run Checkstyle
        run: mvn -q checkstyle:check

      - name: Run SpotBugs
        run: mvn -q spotbugs:check

      - name: Check Test Coverage (JaCoCo)
        run: mvn -pl dina-base-api jacoco:check

      - name: Run OWASP dependency-check (only on dev)
        if: ${{ github.ref == 'refs/heads/dev' }}
        uses: dependency-check/Dependency-Check_Action@main
        id: dina-base-api-dependency-check
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'dina-base-api'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 8
            --suppression owasp-suppression.xml

      - name: Set up for Maven Central deploy (master branch only)
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/setup-java@v5
        with: # running setup-java again overwrites the settings.xml
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_PW
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central (master branch only)
        run: mvn -DsignArtifacts=true --batch-mode javadoc:jar deploy
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PW: ${{ secrets.MAVEN_CENTRAL_PW }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Upload Pages artifact (master branch only)
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'target/generated-docs'

      - name: Deploy to GitHub Pages (master branch only)
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
